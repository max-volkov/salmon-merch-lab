<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Salmon Merch Lab — Suppliers</title>
<style>
:root{--maxw:1320px;--pad:24px;--cols:4;--gap:18px;--coral:#F05A5A;--ink:#311754;--mint:#BEF5F1;--font:Gilroy,Arial,"Helvetica Neue",sans-serif;
--bg:#16161A;--surf:#1F1F24;--surf2:#26262C;--line:#2E2E35;--text:#F3F2EE;--mut:#9A98A0;--hdr:rgba(22,22,26,.88);--chipOn:#F3F2EE;--chipOnT:#16161A;--shadow:0 14px 34px rgba(0,0,0,.45)}
html[data-theme=light]{--bg:#F3F2EE;--surf:#FFFFFF;--surf2:#F3F2EE;--line:#E4E2DC;--text:#231F20;--mut:#77737A;--hdr:rgba(243,242,238,.92);--chipOn:#231F20;--chipOnT:#fff;--shadow:0 14px 34px rgba(35,31,32,.10)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.logo{height:26px;width:auto;color:var(--text);display:block}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--maxw);margin:0 auto;padding:14px var(--pad);display:flex;gap:18px;align-items:center}
.bar .t{font-weight:700;font-size:14px;color:var(--mut);border-left:1px solid var(--line);padding-left:16px}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-width:300px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--text);color:var(--bg);white-space:nowrap}
.btn.coral{background:var(--coral);color:#fff}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.hero{max-width:var(--maxw);margin:0 auto;padding:clamp(22px,3vw,48px) var(--pad) 8px}
.hero h1{font-size:clamp(30px,3.2vw,60px);line-height:1.02;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--coral)}
.hero p{margin:0;color:var(--mut);font-size:clamp(14px,1vw,18px);max-width:70ch}
.stats{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:22px;color:var(--text)}
.filters{max-width:var(--maxw);margin:0 auto;padding:16px var(--pad) 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip .n{color:var(--mut);font-weight:500;margin-left:4px}
.chip.on{background:var(--chipOn);color:var(--chipOnT);border-color:var(--chipOn)}.chip.on .n{color:var(--mut)}
.sel{border:1px solid var(--line);background:var(--surf);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
.grid{max-width:var(--maxw);margin:0 auto;padding:14px var(--pad) 80px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
.card{background:var(--surf);border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--coral)}
.ph{aspect-ratio:4/3;background:var(--surf2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ph0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--coral);background:var(--surf2)}
.ph .cnt{position:absolute;right:10px;bottom:10px;background:rgba(35,31,32,.7);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12px;font-weight:700;color:var(--coral)}
.nm{font-weight:800;font-size:16px;line-height:1.2}
.pr{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--surf2);color:var(--text);font-weight:600}
.st{font-size:12px;border-radius:999px;padding:3px 9px;font-weight:700}
.st-Contact{background:var(--surf2);color:var(--mut)}.st-Quoted{background:var(--mint);color:#0d4f49}.st-Sample{background:#FFE6C7;color:#7a4300}
.st-Ordered{background:#E3DAF2;color:var(--ink)}.st-Worked-with{background:#5B3FA0;color:#fff}.st-No-reply{background:#F7D9D9;color:#8d2b2b}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:stretch;justify-content:flex-end}
.ov.on{display:flex}
.dr{background:var(--bg);color:var(--text);width:min(760px,100%);height:100%;overflow:auto;padding:0 0 60px;animation:sl .2s ease}
@keyframes sl{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);z-index:2}
.x{border:0;background:var(--surf2);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.gal{padding:16px 22px 0}
.gv{position:relative;border-radius:18px;overflow:hidden;background:var(--surf2);aspect-ratio:4/3;touch-action:pan-y}
.gv img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;user-select:none}
.ga{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(22,22,26,.65);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ga.l{left:12px}.ga.r{right:12px}.ga:hover{background:var(--coral)}
.gc{position:absolute;right:12px;bottom:12px;background:rgba(22,22,26,.7);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.gt{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.gt img{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:none}
.gt img.on{opacity:1;border-color:var(--coral)}
.lb .ga{position:fixed}
.thmode{border:1px solid var(--line);background:var(--surf);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:17px}
.db{padding:18px 22px}
.db h2{font-size:28px;line-height:1.1;margin:6px 0 4px;font-weight:800}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kv div{background:var(--surf);border-radius:14px;padding:10px 12px}
.kv small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.kv b{font-size:15px}
.sec{margin-top:18px}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--coral)}
.sec p{margin:0;line-height:1.5;white-space:pre-wrap}
.ph-empty{color:var(--mut);font-style:italic}
.links{display:flex;gap:8px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;text-decoration:none;background:var(--surf);color:var(--text);cursor:pointer}
.lk:hover{border-color:var(--coral)}
.contact{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.contact span{color:var(--mut)}
/* form */
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 22px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.f label.w{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);background:var(--surf)}
.f textarea{min-height:80px;resize:vertical}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--coral);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:80;display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:94vw;max-height:92vh;border-radius:8px}
.loading{grid-column:1/-1;text-align:center;padding:60px;color:var(--mut)}
/* responsive */
@media (min-width:1500px){:root{--maxw:1560px;--cols:5;--pad:32px;--gap:20px}}
@media (min-width:1800px){:root{--maxw:1840px;--cols:6;--pad:40px;--gap:22px}.nm{font-size:17px}}
@media (min-width:2300px){:root{--maxw:2300px;--cols:7;--pad:48px;--gap:24px}}
@media (min-width:2900px){:root{--maxw:2800px;--cols:8}}
@media (max-width:1180px){:root{--cols:3}}
@media (max-width:860px){:root{--cols:2;--pad:16px;--gap:12px}.cb{padding:12px}.nm{font-size:15px}}
@media (max-width:760px){.bar{flex-wrap:wrap;gap:10px}.search{min-width:0;flex:1 1 100%;order:3;padding:8px 14px}.kv{grid-template-columns:1fr 1fr}.f{grid-template-columns:1fr}.bar .t{display:none}
 .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}
 .dr{width:100%}.gal{padding:0}.gv{border-radius:0}.gt{padding:0 12px 4px}.db{padding:16px}.db h2{font-size:24px}.dh{padding:10px 14px}
 .ga{width:38px;height:38px}.stat{padding:8px 12px}.stat b{font-size:18px}}
@media (max-width:480px){:root{--cols:1}.btn#add{padding:9px 14px}.ph{aspect-ratio:16/10}.contact{grid-template-columns:90px 1fr}}
/* wide drawer: gallery left, details right */
@media (min-width:1200px){
 .dr.split{width:min(1280px,86vw);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}
 .dr.split .dh{grid-column:1/-1}
 .dr.split .gal{position:sticky;top:67px;align-self:start;padding:22px 0 22px 26px}
 .dr.split .gv{aspect-ratio:4/3;max-height:calc(100vh - 195px)}
 .dr.split .db{padding:22px 28px 40px}
 .dr:not(.split){width:min(860px,70vw)}
}
@media (min-width:1900px){.dr.split{width:min(1600px,80vw)}.gt img{width:76px;height:76px}.db h2{font-size:34px}}
</style>
</head>

  <div class="sp"></div>
  <div class="search"><span>⌕</span><input id="q" placeholder="Search supplier, product, contact…"></div>

</div></header>

<section class="hero">
  <h1>Who makes <span>what</span> for Salmon</h1>
  <p>All our China suppliers in one place — Canton Fair, Alibaba and past orders. Click a card to see photos, contacts and what we did together.</p>
  <div class="stats" id="stats"></div>
</section>

<div class="filters" id="cats"></div>
<div class="filters">
  <select class="sel" id="fStatus"><option value="">All statuses</option></select>
  <select class="sel" id="fSource"><option value="">All sources</option></select>
  <select class="sel" id="fSort"><option value="name">Sort: A–Z</option><option value="recent">Sort: recently updated</option><option value="photos">Sort: with photos first</option></select>
</div>
<main class="grid" id="grid"><div class="loading">Loading suppliers…</div></main>

<div class="ov" id="ov"><div class="dr" id="dr"></div></div>
<div class="lb" id="lb"><button class="ga l" id="lbp">‹</button><img id="lbi" alt=""><button class="ga r" id="lbn">›</button></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwzk68oBX7BJjOGLT31-hDTeBQ_XJqhpV6b5-h1lS5j5783my69pElPm_d5w8_YqOVG/exec";
const STATUSES = ["Contact","Quoted","Sample","Ordered","Worked with","No reply"];
const FIELDS = [
 ["name","Supplier name",1],["category","Category"],["status","Status"],["source","Source"],["date_met","Date met"],
 ["products","Products",1],["location","Location"],["contact","Contact person"],["email","Email"],["whatsapp","WhatsApp"],["wechat","WeChat ID"],
 ["website","Website"],["catalog","Catalog link"],["alibaba","Alibaba link"],["miro","Miro (booth photos)"],
 ["moq","MOQ"],["price","Price at MOQ (USD)"],["lead_time","Lead time (days)"],["payment","Payment terms"],["priority","Priority"],
 ["next_step","Next step",1],["worked_on","What we did together",1,"ta"],["description","Description (our words)",1,"ta"],["notes","Notes",1,"ta"]];
let DATA=[], HEAD=[], state={cat:"",q:"",status:"",source:"",sort:"name"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photos=r=>String(r.photos||"").split(",").map(s=>s.trim()).filter(Boolean);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
function url(u){u=String(u||"").trim();if(!u)return"";return /^https?:/i.test(u)?u:"https://"+u}

async function load(){
  try{
    const r=await fetch(API,{redirect:"follow"});const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    DATA=j.rows;HEAD=j.head;render();
  }catch(e){$("#grid").innerHTML=`<div class="empty">Couldn't load data. ${esc(e.message||e)}</div>`}
}
async function post(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow"});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"save failed");return j;
}

function filtered(){
  const q=state.q.toLowerCase();
  let L=DATA.filter(r=>(!state.cat||r.category===state.cat)&&(!state.status||r.status===state.status)&&(!state.source||r.source===state.source)
    &&(!q||[r.name,r.products,r.tags,r.contact,r.category,r.notes,r.location].join(" ").toLowerCase().includes(q)));
  if(state.sort==="name")L.sort((a,b)=>a.name.localeCompare(b.name));
  if(state.sort==="recent")L.sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
  if(state.sort==="photos")L.sort((a,b)=>photos(b).length-photos(a).length);
  return L;
}
function render(){
  const cats={};DATA.forEach(r=>{const c=r.category||"Other";cats[c]=(cats[c]||0)+1});
  $("#cats").innerHTML=[`<button class="chip ${!state.cat?"on":""}" data-c="">All<span class="n">${DATA.length}</span></button>`]
    .concat(Object.keys(cats).sort().map(c=>`<button class="chip ${state.cat===c?"on":""}" data-c="${esc(c)}">${esc(c)}<span class="n">${cats[c]}</span></button>`)).join("");
  $("#cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;render()});
  const ss=[...new Set(DATA.map(r=>r.status).filter(Boolean))], so=[...new Set(DATA.map(r=>r.source).filter(Boolean))];
  $("#fStatus").innerHTML=`<option value="">All statuses</option>`+ss.map(s=>`<option ${state.status===s?"selected":""}>${esc(s)}</option>`).join("");
  $("#fSource").innerHTML=`<option value="">All sources</option>`+so.map(s=>`<option ${state.source===s?"selected":""}>${esc(s)}</option>`).join("");
  const nq=DATA.filter(r=>["Quoted","Sample","Ordered","Worked with"].includes(r.status)).length;
  $("#stats").innerHTML=`<div class="stat"><b>${DATA.length}</b>suppliers</div><div class="stat"><b>${Object.keys(cats).length}</b>categories</div><div class="stat"><b>${nq}</b>quoted / sampled / ordered</div><div class="stat"><b>${DATA.filter(r=>photos(r).length).length}</b>with photos</div>`;
  const L=filtered();
  $("#grid").innerHTML=L.length?L.map(card).join(""):`<div class="empty">Nothing found</div>`;
  $("#grid").querySelectorAll(".card").forEach(c=>c.onclick=()=>open(c.dataset.id));
}
function card(r){
  const p=photos(r);
  return `<article class="card" data-id="${esc(r.id)}"><div class="ph">${p.length?`<img loading="lazy" src="${esc(p[0])}" alt="">`:`<div class="ph0">${esc((r.name||"?").trim()[0])}</div>`}${p.length>1?`<span class="cnt">${p.length} photos</span>`:""}</div>
  <div class="cb"><div class="cat">${esc(r.category)}</div><div class="nm">${esc(r.name)}</div><div class="pr">${esc(r.products)}</div>
  <div class="meta">${r.status?`<span class="st st-${esc(r.status.replace(/ /g,"-"))}">${esc(r.status)}</span>`:""}${r.moq?`<span class="tag">MOQ ${esc(r.moq)}</span>`:""}${r.price?`<span class="tag">${esc(r.price)}</span>`:""}<span class="tag">${esc(r.source)}</span></div></div></article>`;
}
function lk(href,label,ico){return href?`<a class="lk" href="${esc(href)}" target="_blank" rel="noopener">${ico} ${esc(label)}</a>`:""}
function open(id){
  const r=DATA.find(x=>x.id===id);if(!r)return;const p=photos(r);
  const wa=String(r.whatsapp||"").replace(/[^\d]/g,"");
  $("#dr").className="dr"+(p.length?" split":"");$("#dr").innerHTML=`<div class="dh"><button class="x" id="cl">×</button><div class="sp"></div><button class="btn ghost" id="ed">Edit</button></div>
  ${p.length?`<div class="gal"><div class="gv" id="gv"><img id="gi" src="${esc(p[0])}" alt="">${p.length>1?`<button class="ga l" id="gp">‹</button><button class="ga r" id="gn">›</button><span class="gc" id="gcn">1 / ${p.length}</span>`:""}</div>${p.length>1?`<div class="gt" id="gt">${p.map((u,i)=>`<img loading="lazy" data-i="${i}" class="${i?"":"on"}" src="${esc(u)}" alt="">`).join("")}</div>`:""}</div>`:""}
  <div class="db"><div class="cat">${esc(r.category)}</div><h2>${esc(r.name)}</h2>
   <div class="meta">${r.status?`<span class="st st-${esc(r.status.replace(/ /g,"-"))}">${esc(r.status)}</span>`:""}<span class="tag">${esc(r.source)}${r.date_met?" · "+esc(r.date_met):""}</span>${r.location?`<span class="tag">📍 ${esc(r.location)}</span>`:""}</div>
   <div class="kv"><div><small>MOQ</small><b>${esc(r.moq||"—")}</b></div><div><small>Price</small><b>${esc(r.price||"—")}</b></div><div><small>Lead time</small><b>${esc(r.lead_time||"—")}</b></div></div>
   <div class="sec"><h4>Products</h4><p>${esc(r.products||"—")}</p></div>
   <div class="sec"><h4>Description</h4><p>${r.description?esc(r.description):'<span class="ph-empty">No description yet — add yours</span>'}</p></div>
   <div class="sec"><h4>What we did together</h4><p>${r.worked_on?esc(r.worked_on):'<span class="ph-empty">—</span>'}</p></div>
   ${r.notes?`<div class="sec"><h4>Notes</h4><p>${esc(r.notes)}</p></div>`:""}
   ${r.next_step?`<div class="sec"><h4>Next step</h4><p>${esc(r.next_step)}</p></div>`:""}
   <div class="sec"><h4>Contact</h4><div class="contact">
     ${r.contact?`<span>Person</span><div>${esc(r.contact)}</div>`:""}${r.email?`<span>Email</span><div><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div>`:""}
     ${r.whatsapp?`<span>WhatsApp</span><div>${esc(r.whatsapp)}</div>`:""}${r.wechat?`<span>WeChat</span><div>${esc(r.wechat)}</div>`:""}</div></div>
   <div class="sec"><h4>Links</h4><div class="links">${lk(url(r.website),"Website","🌐")}${r.catalog&&r.catalog!==r.website?lk(url(r.catalog),"Catalog","📘"):""}${lk(url(r.alibaba),"Alibaba","🛒")}${lk(url(r.miro),"Booth photos in Miro","🖼")}${wa?lk("https://wa.me/"+wa,"WhatsApp","💬"):""}${r.wechat?`<button class="lk" id="cpw">📋 Copy WeChat</button>`:""}</div></div>
   ${r.updated_at?`<p style="color:var(--mut);font-size:12px;margin-top:22px">Updated ${esc(r.updated_at)}${r.updated_by?" by "+esc(r.updated_by):""}</p>`:""}
  </div>`;
  $("#ov").classList.add("on");
  $("#cl").onclick=close;$("#ed").onclick=()=>edit(r);
  const cw=$("#cpw");if(cw)cw.onclick=()=>{navigator.clipboard?.writeText(r.wechat);toast("WeChat ID copied")};
  GAL={p,i:0};
  if(p.length){$("#gi").onclick=()=>{$("#lbi").src=p[GAL.i];$("#lb").style.display="flex"};
    if(p.length>1){$("#gp").onclick=()=>go(-1);$("#gn").onclick=()=>go(1);$("#gt").querySelectorAll("img").forEach(t=>t.onclick=()=>show(+t.dataset.i));
      let sx=null;const gv=$("#gv");gv.ontouchstart=e=>sx=e.touches[0].clientX;gv.ontouchend=e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null}}}
}
let GAL={p:[],i:0};
function show(i){const n=GAL.p.length;if(!n)return;GAL.i=(i+n)%n;const u=GAL.p[GAL.i];const gi=$("#gi");if(gi)gi.src=u;const c=$("#gcn");if(c)c.textContent=(GAL.i+1)+" / "+n;
  document.querySelectorAll("#gt img").forEach((t,k)=>t.classList.toggle("on",k===GAL.i));if($("#lb").style.display==="flex")$("#lbi").src=u}
function go(d){show(GAL.i+d)}
function close(){$("#ov").classList.remove("on")}
$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
$("#lb").onclick=e=>{if(e.target.id==="lb"||e.target.id==="lbi")$("#lb").style.display="none"};
$("#lbp").onclick=e=>{e.stopPropagation();go(-1)};$("#lbn").onclick=e=>{e.stopPropagation();go(1)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb").style.display==="flex")$("#lb").style.display="none";else close()}
  if($("#ov").classList.contains("on")&&GAL.p.length>1){if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)}});
function setTheme(t){document.documentElement.dataset.theme=t;$("#thm").textContent=t==="light"?"☾":"☀";store.set("mlTheme",t)}
setTheme(store.get("mlTheme")||"dark");
$("#thm").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

function edit(r){
  r=r||{id:"",source:"Manual",status:"Contact",category:state.cat||""};
  let ph=photos(r);
  const cats=[...new Set(DATA.map(x=>x.category).filter(Boolean))].sort();
  const inp=([k,l,w,t])=>{const v=esc(r[k]||"");
    if(k==="status")return `<label>${l}<select name="${k}">${STATUSES.map(s=>`<option ${r[k]===s?"selected":""}>${s}</option>`).join("")}</select></label>`;
    if(k==="category")return `<label>${l}<input name="${k}" list="catl" value="${v}"><datalist id="catl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`;
    return `<label class="${w?"w":""}">${l}${t==="ta"?`<textarea name="${k}">${v}</textarea>`:`<input name="${k}" value="${v}">`}</label>`};
  $("#dr").className="dr";$("#dr").innerHTML=`<div class="dh"><button class="x" id="cl">×</button><b>${r.id?"Edit supplier":"New supplier"}</b><div class="sp"></div><button class="btn coral" id="sv">Save</button></div>
  <form class="f" id="fm">
   <label class="w">Your name (shown as “updated by”)<input name="__user" value="${esc(store.get("mlUser")||"")}" placeholder="e.g. Max"></label>
   ${FIELDS.map(inp).join("")}
   <label class="w">Photos<div class="thumbs" id="th"></div><input type="file" id="up" accept="image/*" multiple></label>
  </form>`;
  const th=()=>{$("#th").innerHTML=ph.map((u,i)=>`<div class="t"><img src="${esc(u)}"><button type="button" data-i="${i}">×</button></div>`).join("");
    $("#th").querySelectorAll("button").forEach(b=>b.onclick=()=>{ph.splice(+b.dataset.i,1);th()})};th();
  $("#cl").onclick=()=>r.id?open(r.id):close();
  $("#up").onchange=async e=>{
    for(const f of e.target.files){toast("Uploading "+f.name+"…");
      try{const b64=await shrink(f);const j=await post({action:"upload",data:b64,mime:"image/jpeg",name:f.name});ph.push(j.url);th()}catch(err){toast("Upload failed: "+err.message)}}
    toast("Photos uploaded");e.target.value="";
  };
  $("#sv").onclick=async()=>{
    const fd=new FormData($("#fm"));const rec={id:r.id};FIELDS.forEach(([k])=>rec[k]=fd.get(k)||"");rec.photos=ph.join(", ");
    const user=fd.get("__user")||"";store.set("mlUser",user);rec.updated_by=user;
    if(!rec.name.trim())return toast("Add a supplier name");
    $("#sv").disabled=true;$("#sv").textContent="Saving…";
    try{const j=await post({action:"upsert",record:rec,user});toast("Saved");await load();open(j.id)}
    catch(err){toast("Save failed: "+err.message);$("#sv").disabled=false;$("#sv").textContent="Save"}
  };
  $("#ov").classList.add("on");
}
function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL("image/jpeg",.85).split(",")[1])};im.onerror=rej;im.src=URL.createObjectURL(file)})}

$("#q").oninput=e=>{state.q=e.target.value;render()};
$("#fStatus").onchange=e=>{state.status=e.target.value;render()};
$("#fSource").onchange=e=>{state.source=e.target.value;render()};
$("#fSort").onchange=e=>{state.sort=e.target.value;render()};
$("#add").onclick=()=>edit(null);
load();
</script>
</body>
</html>
